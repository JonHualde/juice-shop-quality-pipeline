name: QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - e2e

jobs:
  quality-gate:
    name: ${{ matrix.suite }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.suite != 'all' && format('["{0}"]', inputs.suite) || '["api","e2e"]') }}
    env:
      BASE_URL: http://localhost:3000
      SECURITY_QUESTION: Your favorite book?
      SECURITY_QUESTION_ANSWER: qa-blueprint-answer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: matrix.suite == 'e2e'
        run: npx playwright install --with-deps chromium

      - name: Start Juice Shop
        run: docker compose up -d --wait --wait-timeout 120

      - name: Run API tests
        if: matrix.suite == 'api'
        run: |
          mkdir -p test-results
          npm run test:api -- --reporters cli,junit --reporter-junit-export test-results/newman.xml

      - name: Run E2E tests
        if: matrix.suite == 'e2e'
        run: npm run test:e2e

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/docker-compose.log

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-artifacts-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Juice Shop
        if: always()
        run: docker compose down --volumes
